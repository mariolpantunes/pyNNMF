  <!-- Missing Values (Nord Red #BF616A) -->
  <path d="M 5 42 L 13 48 M 13 42 L 5 48" stroke="#BF616A" stroke-width="2" stroke-linecap="round"/>
  <path d="M 15 52 L 23 58 M 23 52 L 15 58" stroke="#BF616A" stroke-width="2" stroke-linecap="round"/>

