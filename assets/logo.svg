  <rect x="53" y="56" width="8" height="8" rx="2" fill="#A3BE8C"/>

  <!-- Multiplication Sign (×) -->
  <path d="M 63 47 L 69 53 M 69 47 L 63 53" fill="none" stroke="#ECEFF4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Matrix H (2x3, yellow #EBCB8B) -->
