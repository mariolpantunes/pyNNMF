<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Background -->
  <rect width="100" height="100" fill="#2E3440" rx="8"/>

  <!-- Matrix X (3x3, blue #88C0D0) -->
